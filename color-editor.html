<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Color Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header h1 { font-size: 1rem; font-weight: 600; color: #fff; }
  header span { color: #666; font-size: 0.85rem; }

  .drop-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    border: 2px dashed #333;
    margin: 32px;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    color: #555;
    font-size: 0.95rem;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #4a9eff;
    background: rgba(74,158,255,.05);
    color: #4a9eff;
  }

  .drop-zone svg { width: 40px; height: 40px; opacity: .4; }

  #file-input { display: none; }

  /* main layout */
  .workspace {
    display: none;
    flex: 1;
    overflow: hidden;
  }

  .workspace.visible { display: flex; }

  /* preview panel */
  .preview-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #161616;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }

  .preview-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, #1e1e1e 25%, transparent 25%),
      linear-gradient(-45deg, #1e1e1e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1e1e1e 75%),
      linear-gradient(-45deg, transparent 75%, #1e1e1e 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }

  #svg-preview {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }

  #svg-preview svg {
    width: 100%;
    height: 100%;
    max-width: 640px;
    max-height: 640px;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,.6));
  }

  /* sidebar */
  .sidebar {
    width: 280px;
    background: #1a1a1a;
    border-left: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-header h2 { font-size: 0.8rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .08em; }

  .color-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .color-list::-webkit-scrollbar { width: 4px; }
  .color-list::-webkit-scrollbar-track { background: transparent; }
  .color-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }

  .color-row:hover { background: #222; }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.1);
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .color-swatch input[type="color"] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .color-info { flex: 1; min-width: 0; }
  .color-hex  { font-size: 0.85rem; font-family: monospace; color: #ccc; }
  .color-idx  { font-size: 0.7rem; color: #555; margin-top: 1px; }

  /* actions */
  .sidebar-actions {
    padding: 12px;
    border-top: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button {
    padding: 9px 14px;
    border-radius: 7px;
    border: none;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }

  button:active { transform: scale(.97); }

  .btn-primary {
    background: #4a9eff;
    color: #fff;
  }

  .btn-primary:hover { opacity: .9; }

  .btn-secondary {
    background: #2a2a2a;
    color: #bbb;
    border: 1px solid #333;
  }

  .btn-secondary:hover { background: #333; }

  .btn-danger {
    background: transparent;
    color: #666;
    border: 1px solid #2a2a2a;
    font-size: 0.8rem;
  }

  .btn-danger:hover { color: #ff5f5f; border-color: #ff5f5f; }

  /* filename tag */
  .filename-tag {
    background: #222;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: #888;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <h1>SVG Color Editor</h1>
  <span id="filename-display"></span>
</header>

<!-- drop zone -->
<div class="drop-zone" id="drop-zone">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M16 12l-4-4m0 0L8 12m4-4v12"/>
  </svg>
  <span>Drop SVG here or click to open</span>
  <small style="color:#444">SVG files produced by tracer.py</small>
  <input type="file" id="file-input" accept=".svg">
</div>

<!-- main workspace -->
<div class="workspace" id="workspace">
  <div class="preview-panel">
    <div class="preview-bg"></div>
    <div id="svg-preview"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Colors</h2>
      <span id="color-count" style="font-size:.75rem;color:#555"></span>
    </div>
    <div class="color-list" id="color-list"></div>
    <div class="sidebar-actions">
      <button class="btn-primary" id="btn-export">Export SVG</button>
      <button class="btn-secondary" id="btn-reset">Reset Colors</button>
      <button class="btn-danger" id="btn-open-new">Open different file</button>
    </div>
  </div>
</div>

<script>
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const workspace  = document.getElementById('workspace');
  const svgPreview = document.getElementById('svg-preview');
  const colorList  = document.getElementById('color-list');
  const colorCount = document.getElementById('color-count');
  const fileDisplay= document.getElementById('filename-display');

  const ID_RE = /^color-(\d+)-([0-9a-f]{6})$/;

  let svgDoc = null;          // live DOM of the SVG
  let originalColors = {};    // id → original hex

  // ── file loading ──────────────────────────────────────────────────────────

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.name.endsWith('.svg')) loadFile(f);
  });

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => initSVG(e.target.result, file.name);
    reader.readAsText(file);
  }

  // ── SVG init ──────────────────────────────────────────────────────────────

  function initSVG(svgText, filename) {
    const parser = new DOMParser();
    svgDoc = parser.parseFromString(svgText, 'image/svg+xml').documentElement;

    // inject into preview
    svgPreview.innerHTML = '';
    svgPreview.appendChild(svgDoc);

    // collect color groups
    originalColors = {};
    const groups = getColorGroups();
    groups.forEach(g => { originalColors[g.id] = g.hex; });

    renderColorList(groups);
    colorCount.textContent = `${groups.length} groups`;
    fileDisplay.innerHTML = `<span class="filename-tag">${filename}</span>`;

    dropZone.style.display = 'none';
    workspace.classList.add('visible');
  }

  function getColorGroups() {
    const result = [];
    svgDoc.querySelectorAll('g[id]').forEach(el => {
      const m = el.id.match(ID_RE);
      if (!m) return;
      result.push({ el, id: el.id, index: +m[1], hex: '#' + m[2] });
    });
    result.sort((a, b) => a.index - b.index);
    return result;
  }

  // ── color list UI ─────────────────────────────────────────────────────────

  function renderColorList(groups) {
    colorList.innerHTML = '';
    groups.forEach(g => {
      const row = document.createElement('div');
      row.className = 'color-row';
      row.dataset.groupId = g.id;

      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.background = g.hex;

      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = normalizeHex(g.hex);
      picker.addEventListener('input', () => {
        applyColor(g.id, picker.value, swatch, hexDisplay);
      });

      swatch.appendChild(picker);

      const info = document.createElement('div');
      info.className = 'color-info';

      const hexDisplay = document.createElement('div');
      hexDisplay.className = 'color-hex';
      hexDisplay.textContent = g.hex;

      const idxDisplay = document.createElement('div');
      idxDisplay.className = 'color-idx';
      idxDisplay.textContent = `group ${g.index}`;

      info.appendChild(hexDisplay);
      info.appendChild(idxDisplay);
      row.appendChild(swatch);
      row.appendChild(info);
      colorList.appendChild(row);
    });
  }

  function applyColor(groupId, newHex, swatch, hexDisplay) {
    const el = svgDoc.getElementById(groupId);
    if (!el) return;
    el.setAttribute('fill', newHex);
    swatch.style.background = newHex;
    hexDisplay.textContent = newHex;

    // update id to reflect new hex
    const m = groupId.match(ID_RE);
    if (m) {
      const newId = `color-${m[1]}-${newHex.replace('#','').toLowerCase()}`;
      el.id = newId;
      // update row dataset
      const row = colorList.querySelector(`[data-group-id="${groupId}"]`);
      if (row) row.dataset.groupId = newId;
    }
  }

  // ── export ────────────────────────────────────────────────────────────────

  document.getElementById('btn-export').addEventListener('click', () => {
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(svgDoc);
    const blob = new Blob([svgStr], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'recolored.svg';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ── reset ─────────────────────────────────────────────────────────────────

  document.getElementById('btn-reset').addEventListener('click', () => {
    getColorGroups().forEach(g => {
      const origHex = Object.values(originalColors).find((_, i) =>
        Object.keys(originalColors)[i].split('-')[1] === g.id.split('-')[1]
      ) || originalColors[g.id];
      if (origHex) {
        g.el.setAttribute('fill', origHex);
        g.el.id = g.id;
      }
    });
    // re-render UI from current SVG state
    renderColorList(getColorGroups());
  });

  // ── open new ──────────────────────────────────────────────────────────────

  document.getElementById('btn-open-new').addEventListener('click', () => {
    workspace.classList.remove('visible');
    dropZone.style.display = '';
    svgDoc = null;
    fileInput.value = '';
  });

  // ── util ──────────────────────────────────────────────────────────────────

  function normalizeHex(hex) {
    // ensure #rrggbb (color input needs this)
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    return '#' + hex.padStart(6, '0');
  }
</script>
</body>
</html>
